<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Plane Alarm</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 520px;
            margin: 60px auto;
            padding: 24px;
            text-align: center;
            line-height: 1.5;
        }

        a.button {
            display: inline-block;
            margin-top: 18px;
            padding: 16px 24px;
            background: rgb(0, 123, 255);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
        }

        .note {
            margin-top: 24px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <h1>Plane Alarm Webpage</h1>

    <p id="message">To provide Plane Alarm with callsign, add it to url after /flight/</p>

    <a id="openLink" class="button" href="https://korkuck.github.io/plane-alarm/">
        Open Plane Alarm Download Page
    </a>

    <a id="findFlightLink" class="button"
        href="`intent://korkuck.github.io/plane-alarm/flight/${encodeURIComponent(QFA10)}#Intent;scheme=https;package=com.example.plane_alarm;end`">
        QFA10 flight example in Plane Alarm app
    </a>

    <a class="button" href="https://github.com/korkuck/plane-alarm/releases/download/0.2.0/plane-alarm-release.apk">
        Download Android APK
    </a>

    <p class="note">
        After installing, tap the same flight link again.
    </p>

    <script>
        const parts = window.location.pathname.split("/");
        const flightIndex = parts.indexOf("flight");
        const callsign = flightIndex !== -1 ? parts[flightIndex + 1] : "";

        if (callsign) {
            const cleanCallsign = callsign.toUpperCase();
            const flightLink =
                `https://korkuck.github.io/plane-alarm/flight/${cleanCallsign}`;

            const flightIntentLink = `intent://korkuck.github.io/plane-alarm/flight/${encodeURIComponent(cleanCallsign)}#Intent;scheme=https;package=com.example.plane_alarm;end`;

            document.getElementById("message").textContent =
                `Choose how to look for your flight ${cleanCallsign}:`;

            document.getElementById("openLink").textContent =
                `Open ${cleanCallsign} in web page`;

            document.getElementById("openLink").href = flightLink;

            document.getElementById("findFlightLink").textContent =
                `Find ${cleanCallsign} in Plane Alarm app`;

            document.getElementById("findFlightLink").href = flightIntentLink;
        }
    </script>
</body>

</html>
